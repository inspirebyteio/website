version: 1
frontend:
    phases:
        preBuild:
            commands:
                - npm ci
        build:
            commands:
                - npm run build
    artifacts:
        baseDirectory: build
        files:
            - "**/*"
    cache:
        paths:
            - node_modules/**/*
    customHeaders:
        # JavaScript files
        - pattern: "**/*.js"
          headers:
              - key: "Cache-Control"
                value: "public, max-age=31536000, immutable"
        # CSS files
        - pattern: "**/*.css"
          headers:
              - key: "Cache-Control"
                value: "public, max-age=31536000, immutable"
        # Fonts
        - pattern: "**/*.{woff,woff2,ttf,eot,otf}"
          headers:
              - key: "Cache-Control"
                value: "public, max-age=31536000, immutable"
        # Images
        - pattern: "**/*.{jpg,jpeg,png,gif,svg,webp}"
          headers:
              - key: "Cache-Control"
                value: "public, max-age=31536000, immutable"
        # HTML (set no-cache for fresh delivery)
        - pattern: "**/*.html"
          headers:
              - key: "Cache-Control"
                value: "no-cache"
        # Manifest and other JSON files
        - pattern: "**/*.json"
          headers:
              - key: "Cache-Control"
                value: "no-cache"
